name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# 发布流程不取消进行中的任务，且不与被调用的 CI 并发组冲突。
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      # npm Trusted Publishing 使用 npm 11，通过 OIDC 认证，无需 npm Token。
      - name: Update npm
        run: npm install --global npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Git tag v$TAG_VERSION does not match package.json version $VERSION"
            exit 1
          fi

      - name: Determine npm dist-tag
        id: dist-tag
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *"-"* ]]; then
            PRERELEASE="${VERSION#*-}"
            CHANNEL="${PRERELEASE%%.*}"
            case "$CHANNEL" in
              alpha|beta|rc) DIST_TAG="$CHANNEL" ;;
              *)
                echo "::error::Unsupported prerelease channel: $CHANNEL"
                exit 1
                ;;
            esac
          else
            DIST_TAG="latest"
          fi
          echo "tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION with npm dist-tag: $DIST_TAG"

      # 完整 CI 已通过；发布 job 单独构建，执行 publint 和 attw。
      - name: Build
        run: pnpm build

      # pnpm pack 将 Catalog / Workspace 引用转换为标准版本范围。
      - name: Pack release
        id: pack
        shell: bash
        run: |
          PACK_DIR=$(mktemp -d "$RUNNER_TEMP/react-theme-release-XXXXXX")
          pnpm pack --pack-destination "$PACK_DIR"
          shopt -s nullglob
          TARBALLS=("$PACK_DIR"/*.tgz)
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release tarball"
            exit 1
          fi
          echo "tarball=${TARBALLS[0]}" >> "$GITHUB_OUTPUT"

      - name: Verify release tarball
        env:
          RELEASE_TARBALL: ${{ steps.pack.outputs.tarball }}
        shell: bash
        run: |
          PACKAGE_DIR=$(mktemp -d "$RUNNER_TEMP/react-theme-manifest-XXXXXX")
          tar -xzf "$RELEASE_TARBALL" -C "$PACKAGE_DIR"
          export RELEASE_PACKAGE_DIR="$PACKAGE_DIR/package"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { existsSync, readFileSync } from 'node:fs'
          import path from 'node:path'
          const root = process.env.RELEASE_PACKAGE_DIR
          const source = JSON.parse(readFileSync('package.json', 'utf8'))
          const packed = JSON.parse(readFileSync(path.join(root, 'package.json'), 'utf8'))
          assert.equal(packed.name, source.name)
          assert.equal(packed.version, source.version)
          assert.notEqual(packed.private, true)
          for (const field of ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies']) {
            for (const [name, version] of Object.entries(packed[field] ?? {})) {
              assert.doesNotMatch(version, /^(?:catalog|workspace):/, `${field}.${name} must use a standard version range`)
            }
          }
          const verifyEntry = (entry) => {
            if (typeof entry === 'string') {
              assert.ok(existsSync(path.join(root, entry)), `Missing package entry: ${entry}`)
            } else if (entry && typeof entry === 'object') {
              for (const value of Object.values(entry)) verifyEntry(value)
            }
          }
          for (const field of ['main', 'module', 'types', 'exports']) {
            assert.ok(packed[field], `Missing ${field}`)
            assert.deepEqual(packed[field], source[field])
            verifyEntry(packed[field])
          }
          console.log(`Verified ${packed.name}@${packed.version}`)
          NODE

      - name: Preview publish
        env:
          RELEASE_TARBALL: ${{ steps.pack.outputs.tarball }}
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: npm publish "$RELEASE_TARBALL" --dry-run --ignore-scripts --registry https://registry.npmjs.org/ --access public --tag "$DIST_TAG"

      # 发布已检查的同一 tarball，不重复执行目录的 prepublishOnly。
      - name: Publish package
        env:
          RELEASE_TARBALL: ${{ steps.pack.outputs.tarball }}
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: npm publish "$RELEASE_TARBALL" --ignore-scripts --registry https://registry.npmjs.org/ --access public --tag "$DIST_TAG"
