# GitHub Actions 工作流名称
name: CI

# 定义工作流的触发条件
on:
  # 允许在 GitHub Actions 页面手动触发
  workflow_dispatch:

  # 推送到 main 分支时触发
  push:
    branches:
      - main

  # 创建或更新目标分支为 main 的 Pull Request 时触发
  pull_request:
    branches:
      - main

# 限制 GitHub Actions 默认权限
# 当前 CI 只需要读取仓库内容
permissions:
  contents: read

# 控制并发执行
concurrency:
  # 同一个 workflow + 同一个 ref（分支 / PR / Tag）归到同一并发组
  group: ${{ github.workflow }}-${{ github.ref }}

  # 当同一组有新的 CI 开始时，取消正在运行的旧 CI
  # 适合 CI 场景，避免旧提交继续占用 Runner
  cancel-in-progress: true

jobs:
  # 定义一个名为 check 的 Job
  check:
    name: Check
    # 使用 GitHub 提供的最新版 Ubuntu Runner
    runs-on: ubuntu-latest

    # 最长运行 10 分钟，避免异常任务长时间占用 Runner
    timeout-minutes: 10

    steps:
      # 拉取当前仓库代码
      - name: Checkout
        uses: actions/checkout@v6

      # 安装并配置 pnpm
      # 如果 package.json 中声明了 packageManager，
      # pnpm/action-setup 会使用对应的 pnpm 版本
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # 根据 .nvmrc 安装项目指定的 Node.js 版本
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # 与本地开发环境共用同一版本声明
          node-version-file: .nvmrc

          # 启用 pnpm 依赖缓存，加快后续 CI 的依赖安装速度
          cache: pnpm

          # 指定用于计算缓存 key 的 lockfile
          cache-dependency-path: pnpm-lock.yaml

      # 根据 pnpm-lock.yaml 安装依赖
      # --frozen-lockfile 表示不允许 CI 自动修改 lockfile
      # 如果 package.json 与 lockfile 不一致，直接失败
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 执行项目代码检查
      # 具体内容取决于 package.json 中的 scripts.check
      # 通常可能包含 lint、typecheck、format check 等
      - name: Check
        run: pnpm check

      # 构建项目
      - name: Build
        run: pnpm build

      - name: Check React 18 packed consumer and Vite resolution
        timeout-minutes: 5
        run: pnpm test:react18

      # 检查最终 npm package 的内容是否符合预期
      # 具体行为取决于 package.json 中的 scripts["pack:check"]
      - name: Check package
        run: pnpm pack:check

  vite-compat:
    name: Vite ${{ matrix.vite }} compatibility
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported release and latest patch within each supported major.
        vite: [5.1.0, '5', 6.0.0, '6', 7.0.0, '7', 8.0.0, '8']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Only CI installs extra Vite versions, outside the workspace.
      - name: Install selected Vite
        env:
          VITE_VERSION: ${{ matrix.vite }}
        run: npm install --prefix "$RUNNER_TEMP/vite-consumer" --no-package-lock --no-audit --no-fund "vite@$VITE_VERSION"

      - name: Verify packed plugin
        timeout-minutes: 5
        env:
          EXPECTED_VITE: ${{ matrix.vite }}
        run: pnpm test:vite-compat --vite-dir "$RUNNER_TEMP/vite-consumer"

  e2e:
    name: E2E (Chromium)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      # 先构建库和两个应用，再运行浏览器测试。
      # Playwright 总超时为 5 分钟，步骤超时为 10 分钟，给产物上传留出时间。
      - name: Run E2E tests
        id: e2e
        timeout-minutes: 10
        run: pnpm test:e2e --global-timeout=300000

      # E2E 构建已生成 Start 路由树，可在干净环境下检查两个应用。
      - name: Check app types
        run: pnpm --filter @react-theme/react-spa typecheck && pnpm --filter @react-theme/tanstack-start typecheck

      - name: Upload failed E2E results
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
