shellEmulator: true
trustPolicy: no-downgrade

trustPolicyExclude:
  - undici-types@6.21.0
  - semver@6.3.1

packages:
  - apps/*

# React DOM 18 types declare a wildcard React types dependency.
# Keep that edge on React 18 without changing the React 19 consumers.
overrides:
  '@types/react-dom@18>@types/react': 'catalog:react18'

catalog:
  '@antfu/eslint-config': ^8.3.0
  '@eslint-react/eslint-plugin': ^3.0.0
  '@playwright/test': ^1.56.1
  '@prettier/plugin-xml': ^3.4.2
  '@ringotangs/tsconfig': ^0.3.0
  '@tanstack/react-router': ^1.170.44
  '@tanstack/react-start': ^1.169.2
  '@testing-library/dom': ^10.4.2
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@types/node': ^22.20.5
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.2
  cross-env: ^10.1.0
  eslint: ^10.12.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-refresh: ^0.5.7
  jsdom: ^30.1.2
  nitro: 3.0.260903-beta
  prettier: ^3.9.10
  react: ^19.3.1
  react-dom: ^19.3.1
  tsdown: ^0.23.1
  typescript: ^5.9.3
  vite: ^8.3.4
  vitest: ^4.1.11
catalogs:
  react18:
    '@types/react': 18.2.79
    '@types/react-dom': 18.2.25
    react: 18.2.0
    react-dom: 18.2.0
